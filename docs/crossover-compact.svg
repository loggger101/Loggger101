<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 526" width="680" height="526" role="img" aria-label="Where the asteroid belt turns from S-types to C-types, from asteroid-belt-gradient&#x27;s results: the raw count puts the crossover at 2.84 au; corrected, 2.46 au (families collapsed, D ≥ 10 km, weighted for brightness bias), 2.47 au (families collapsed, D ≥ 53 km, complete in size), 2.41 au (background only, D ≥ 53 km, family members left out), each 1.4–1.5 au from 10% to 90% C-types, wider than the belt itself; the snow line is at 2.67 au and the main belt runs from 2.1 to 3.3 au.">
