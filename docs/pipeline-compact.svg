<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1042" width="760" height="1042" role="img" aria-label="How the repos connect: General_Research holds the sources that AsteroidCatalog, spacecost, spacevalue and economicspace cite. AsteroidCatalog releases feed asteroid-belt-gradient, which builds the paper, and economicspace. spacevalue installs spacecost and prices minerals at each destination, and its releases feed economicspace too, which also installs spacecost, quietlaunch, quietqueue and samebytes, cites the starred-repos audit, and ranks mining targets by profit.">
