# Fails a push or pull request that leaves the profile inconsistent (a generated image that
# no longer matches its generator, a missing or unused docs/ file, README numbers that
# disagree with tools/counts.json, a section link to no heading, or an OneDrive conflict
# copy; see tools/check.py) or that breaks a test (test_loc.py, test_tools.py).
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/check.py
      - run: python tools/test_loc.py
      - run: python tools/test_tools.py
