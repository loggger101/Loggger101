# Keeps the research-sources and agent-skills tiles, and each repo's lines of code, in step
# with their repos. The private repos' line counts are refreshed by running loc.py locally.
# Commits only when a count has changed.
name: Refresh counts

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/refresh_counts.py
      - run: python tools/tiles.py docs/stats
      - run: python tools/loc.py --public-only
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh the profile's counts"
          git push
