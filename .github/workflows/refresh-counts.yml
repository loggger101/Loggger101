# Keeps the research-sources and agent-skills tiles, each repo's lines of code, and the
# activity and languages panels in step with their repos. The private repos' counts are
# refreshed by running loc.py and refresh_activity.py locally. The activity panel runs to
# the week of the run, so a run commits every week; it commits only if tools/check.py
# passes on the result
# (a push made with the workflow's token doesn't trigger check.yml, so it runs here).
# A separate job checks every README link, so a dead link fails the run without holding
# back the counts.
name: Refresh counts

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

# A manual run and the Monday run must not both push.
concurrency:
  group: refresh-counts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/refresh_counts.py
      - run: python tools/tiles.py docs/stats
      - run: python tools/loc.py --public-only
      - run: python tools/refresh_activity.py --public-only
      - run: python tools/activity.py docs
      - run: python tools/languages.py docs
      - run: python tools/check.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh the profile's counts"
          git push

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/check.py --links
