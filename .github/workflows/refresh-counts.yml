# Keeps the research-sources and agent-skills tiles, each repo's lines of code, the
# break-even, crossover and sources charts and the activity and languages panels in step with their repos, and the
# flyby chart with NASA/JPL's close approaches for the week ahead, and the badges with shields.io's
# drawing of each repo's latest release. The private repos' counts are
# refreshed by running loc.py and refresh_activity.py locally. The activity panel runs to
# the week of the run, so a run commits every week; it commits only if tools/check.py
# passes on the result
# (a push made with the workflow's token doesn't trigger check.yml, so it runs here).
# A separate job checks every README link, and that last week's refresh happened, so a dead
# link or a missed refresh fails the run without holding back the counts.
name: Refresh counts

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

# Read-only unless a job says otherwise; only the refresh job pushes.
permissions:
  contents: read

# A manual run and the Monday run must not both push.
concurrency:
  group: refresh-counts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A hung clone or API call fails the run instead of holding it for six hours.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/refresh_counts.py
      - run: python tools/tiles.py docs/stats
      - run: python tools/pipeline.py docs
      - run: python tools/breakeven.py docs
      - run: python tools/crossover.py docs
      - run: python tools/sources.py docs
      - run: python tools/loc.py --public-only
      - run: python tools/refresh_activity.py --public-only
      - run: python tools/sparks.py docs/sparks
      # JPL's API is outside our hands; if it's down, keep last week's flybys (the chart
      # prints its dates) and refresh everything else.
      - run: python tools/refresh_flybys.py
        continue-on-error: true
      - run: python tools/flybys.py docs
      # shields.io is outside our hands too; if it's down, keep last week's badges.
      - run: python tools/badges.py docs/badges
        continue-on-error: true
      - run: python tools/activity.py docs
      - run: python tools/languages.py docs
      - run: python tools/check.py
      # Commits only what a refresh is meant to change (the README, the drawings in docs/
      # and counts.json, new files there included) and fails if anything else changed, so a
      # script that wrote somewhere it shouldn't can't reach the profile.
      - name: Commit if anything changed
        run: |
          git add README.md docs tools/counts.json
          if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "The refresh changed files outside README.md, docs/ and tools/counts.json:"
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh the profile's counts"
          git push

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Also fails if the data the refresh keeps current is more than a week old, which is
      # how a step allowed to fail (the flybys, the badges) can't fail every week unnoticed, or if a
      # figure the profile quotes is gone from its repo's README.
      - run: python tools/check.py --links --fresh --facts
